[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-rational-lifting"
version = "0.2.1"
description = "Sparse rational-input specialization of Kelner's identity-modulus lifting solver"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kaiwen Jin", email = "yui.ui.siki@gmail.com"}]
requires-python = ">=3.11"
dependencies = ["python-flint==0.8.0"]

[project.urls]
Repository = "https://github.com/yuiyuiui/sparse-rational-lifting"
Documentation = "https://github.com/yuiyuiui/sparse-rational-lifting/tree/main/docs"
Issues = "https://github.com/yuiyuiui/sparse-rational-lifting/issues"

[project.optional-dependencies]
dev = ["build>=1.3", "ruff>=0.14"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]
