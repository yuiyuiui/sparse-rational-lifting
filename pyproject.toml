[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aim044-lift"
version = "0.1.0"
description = "Sparse rational-input specialization of Kelner's identity-modulus lifting solver"
requires-python = ">=3.11"
dependencies = ["python-flint==0.8.0"]

[tool.setuptools.packages.find]
where = ["src"]
